name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/RevitGeoSuite.SharedUI.Web/package-lock.json

    - name: Provision Revit 2024 API
      shell: pwsh
      run: |
        $package = Join-Path $env:RUNNER_TEMP 'revit-api.zip'
        $apiDir = Join-Path $env:RUNNER_TEMP 'revit-api'
        Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/revit_api_x64/2024.0.2/revit_api_x64.2024.0.2.nupkg' -OutFile $package
        if ((Get-FileHash $package -Algorithm SHA256).Hash -ne '0065A7C8AD8B51011FDA19ECDBE299AAB9CAC0E1F2AAB62F91C4D45FADD5D65B') {
          throw 'Revit API package checksum mismatch.'
        }
        Expand-Archive -Path $package -DestinationPath $apiDir
        $revitApiDir = Join-Path $apiDir 'lib\NET480'
        "RevitInstallDir=$revitApiDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RevitApiDir=$revitApiDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build web assets
      working-directory: src/RevitGeoSuite.SharedUI.Web
      run: |
        npm ci
        npm run build

    - name: Build .NET solution
      run: dotnet build --no-restore --configuration Release

    - name: Run .NET tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Run web tests
      working-directory: src/RevitGeoSuite.SharedUI.Web
      run: npm test

    - name: Verify TypeScript contracts
      run: pwsh tools/VerifyContracts.ps1

    - name: Run svelte-check (non-blocking)
      continue-on-error: true
      working-directory: src/RevitGeoSuite.SharedUI.Web
      run: npm run check
